name: Trigger auto deployment for backlineit-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"
          DIRECT_URL: "postgresql://build:build@localhost:5432/build"
          NEXTAUTH_SECRET: "build_secret_must_be_at_least_32_characters_long_for_auth"
          NEXTAUTH_URL: "https://backlineit.hu"
        run: |
          npx prisma generate
          npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BACKLINEITWEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BACKLINEITWEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKLINEITWEB_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name backlineitcr

      - name: Build and push container image
        run: |
          docker build -t backlineitcr.azurecr.io/backlineit-web:${{ github.sha }} -t backlineitcr.azurecr.io/backlineit-web:latest .
          docker push backlineitcr.azurecr.io/backlineit-web:${{ github.sha }}
          docker push backlineitcr.azurecr.io/backlineit-web:latest

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name backlineit-web \
            --resource-group backlineit-rg \
            --image backlineitcr.azurecr.io/backlineit-web:${{ github.sha }}
